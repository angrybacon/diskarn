name: Release

on: push

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm lint

  tests:
    name: Tests
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm test:coverage
      - uses: davelosert/vitest-coverage-report-action@v2
        if: ${{ !cancelled() }}
        with:
          file-coverage-mode: all
          pr-number: auto
          threshold-icons: "{0: '🟠', 80: '🟡', 90: '⚪'}"
